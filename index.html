<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Snake: Bat Launcher</title>
<style>
html,body{margin:0;background:#090b10;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;height:100%;overflow:hidden}
body{display:flex;justify-content:center;align-items:center}
#app{width:min(94vw,700px);height:100%;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:12px;box-sizing:border-box}
h1{margin:0;font-size:clamp(25px,7vw,42px)} .sub{color:#9ca3af;font-size:14px}
#hud{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.pill,button{background:#181c25;border:1px solid #303746;color:#fff;border-radius:11px;padding:9px 12px;font-weight:700}
button{cursor:pointer}.grow{flex:1}
canvas{width:100%;aspect-ratio:1;background:#0d1118;border:1px solid #343b48;border-radius:18px;box-shadow:0 20px 70px #000b;touch-action:none}
#pad{display:grid;grid-template-columns:repeat(3,64px);gap:7px;justify-content:center}
#pad button{height:52px;font-size:22px;padding:0}.blank{visibility:hidden}
#hint{text-align:center;color:#8b93a3;font-size:12px}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px}
.card{background:#171b23;border:1px solid #394151;border-radius:20px;padding:26px;max-width:360px;width:100%;text-align:center;box-shadow:0 30px 100px #000}
.card h2{font-size:32px;margin:0 0 8px}.card p{color:#aeb5c2}.card button{width:100%;font-size:17px}
</style>
</head>
<body>
<div id="app">
<h1>🐍 Snake: Bat Launcher</h1>
<div class="sub">Snake, except you can launch bats. Obviously.</div>
<div id="hud">
<div class="pill">Score <span id="score">0</span></div>
<div class="pill">High <span id="high">0</span></div>
<div class="pill">🦇 <span id="ammo">3</span></div>
<button id="pause">Pause</button><button id="restart">Restart</button><span class="grow"></span>
</div>
<canvas id="game" width="600" height="600"></canvas>
<div id="pad">
<button class="blank"></button><button data-d="U">▲</button><button class="blank"></button>
<button data-d="L">◀</button><button data-d="D">▼</button><button data-d="R">▶</button>
</div>
<div id="hint">WASD / arrows to move • SPACE to launch a bat • P to pause</div>
</div>
<div id="modal"><div class="card"><h2>💥 Game Over</h2><p id="reason"></p><button id="again">Play Again</button></div></div>
<script>
(()=>{
const c=document.getElementById('game'),x=c.getContext('2d'),S=24,C=25;
const scoreEl=document.getElementById('score'),highEl=document.getElementById('high'),ammoEl=document.getElementById('ammo');
let hi=+(localStorage.snakeBatHigh||0),snake,dir,next,food,enemies,bats,ammo,score,running,paused,last=0,acc=0;
highEl.textContent=hi;
const rnd=()=>({x:Math.floor(Math.random()*S),y:Math.floor(Math.random()*S)});
const same=(a,b)=>a.x===b.x&&a.y===b.y;
function free(p){return !snake.some(q=>same(q,p))&&!enemies.some(q=>same(q,p))&&!same(food||{x:-1,y:-1},p)}
function newFood(){let p;do p=rnd();while(!free(p));return p}
function enemy(){let p;do p=rnd();while(!free(p)||Math.abs(p.x-snake[0].x)+Math.abs(p.y-snake[0].y)<9);return{x:p.x,y:p.y,dx:0,dy:1,t:0}}
function reset(){
 snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir={x:1,y:0};next={x:1,y:0};
 food=null;enemies=[];bats=[];ammo=3;score=0;running=true;paused=false;acc=0;last=performance.now();
 food=newFood();enemies.push(enemy());modal.style.display='none';ui();requestAnimationFrame(loop)
}
function ui(){scoreEl.textContent=score;ammoEl.textContent=ammo;if(score>hi){hi=score;localStorage.snakeBatHigh=hi;highEl.textContent=hi}}
function turn(d){
 let q={U:{x:0,y:-1},D:{x:0,y:1},L:{x:-1,y:0},R:{x:1,y:0}}[d];
 if(q&&!(q.x===-dir.x&&q.y===-dir.y))next=q
}
function fire(){
 if(!running||paused||ammo<1)return;
 ammo--;bats.push({x:snake[0].x,y:snake[0].y,dx:dir.x,dy:dir.y,life:18});ui()
}
function step(){
 dir=next;let h={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
 if(h.x<0||h.x>=S||h.y<0||h.y>=S||snake.some(q=>same(q,h)))return gameover("You crashed into yourself or the wall.");
 snake.unshift(h);
 if(same(h,food)){score+=10;ammo++;food=newFood();if(score%50===0&&enemies.length<5)enemies.push(enemy())}else snake.pop();
 for(const e of enemies){
   e.t--;if(e.t<=0){
    let dx=h.x-e.x,dy=h.y-e.y;
    if(Math.abs(dx)>Math.abs(dy)){e.dx=Math.sign(dx);e.dy=0}else{e.dy=Math.sign(dy);e.dx=0}
    e.t=2+Math.floor(Math.random()*4)
   }
   let nx=e.x+e.dx,ny=e.y+e.dy;
   if(nx>=0&&nx<S)e.x=nx;if(ny>=0&&ny<S)e.y=ny;
 }
 if(enemies.some(e=>same(e,snake[0])))return gameover("The enemy caught you.");
 for(let i=bats.length-1;i>=0;i--){
   let b=bats[i];b.x+=b.dx;b.y+=b.dy;b.life--;
   if(b.x<0||b.x>=S||b.y<0||b.y>=S||b.life<=0){bats.splice(i,1);continue}
   let hit=enemies.findIndex(e=>same(e,b));
   if(hit>=0){enemies.splice(hit,1);bats.splice(i,1);score+=25;ammo++;if(!enemies.length)enemies.push(enemy())}
 }
 ui()
}
function gameover(s){running=false;reason.textContent=s+" Final score: "+score;modal.style.display='flex'}
function rr(px,py,w,h,r){x.beginPath();x.roundRect(px,py,w,h,r);x.fill()}
function draw(){
 x.clearRect(0,0,600,600);x.fillStyle='#0b0f16';x.fillRect(0,0,600,600);
 x.strokeStyle='#151b25';x.lineWidth=1;
 for(let i=1;i<S;i++){x.beginPath();x.moveTo(i*C,0);x.lineTo(i*C,600);x.stroke();x.beginPath();x.moveTo(0,i*C);x.lineTo(600,i*C);x.stroke()}
 x.fillStyle='#67e8f9';x.beginPath();x.arc(food.x*C+12.5,food.y*C+12.5,7,0,7);x.fill();
 for(const e of enemies){x.fillStyle='#f59e0b';rr(e.x*C+4,e.y*C+4,17,17,5);x.fillStyle='#111';x.beginPath();x.arc(e.x*C+9,e.y*C+9,2,0,7);x.arc(e.x*C+16,e.y*C+9,2,0,7);x.fill()}
 for(const b of bats){x.save();x.translate(b.x*C+12.5,b.y*C+12.5);x.rotate(Math.atan2(b.dy,b.dx));x.fillStyle='#c58b55';x.fillRect(-8,-2,14,4);x.fillStyle='#eee';x.fillRect(4,-6,7,12);x.restore()}
 snake.forEach((q,i)=>{x.fillStyle=i?'#34d399':'#a7f3d0';rr(q.x*C+2,q.y*C+2,21,21,6)});
 let h=snake[0],cx=h.x*C+12.5,cy=h.y*C+12.5;x.fillStyle='#07130d';
 let ex=dir.x*4,ey=dir.y*4,px=-dir.y*4,py=dir.x*4;
 x.beginPath();x.arc(cx+ex+px,cy+ey+py,2.2,0,7);x.arc(cx+ex-px,cy+ey-py,2.2,0,7);x.fill();
 if(paused&&running){x.fillStyle='#0009';x.fillRect(0,0,600,600);x.fillStyle='#fff';x.font='bold 42px system-ui';x.textAlign='center';x.fillText('PAUSED',300,315)}
}
function loop(t){if(!running)return;if(!paused){acc+=t-last;while(acc>=105){step();acc-=105}}last=t;draw();requestAnimationFrame(loop)}
document.addEventListener('keydown',e=>{
 let k=e.key.toLowerCase();if(['arrowup','arrowdown','arrowleft','arrowright',' ','w','a','s','d','p'].includes(k))e.preventDefault();
 if(k==='w'||k==='arrowup')turn('U');if(k==='s'||k==='arrowdown')turn('D');if(k==='a'||k==='arrowleft')turn('L');if(k==='d'||k==='arrowright')turn('R');if(k===' ')fire();if(k==='p'){paused=!paused;draw()}
});
document.querySelectorAll('#pad button[data-d]').forEach(b=>{b.addEventListener('pointerdown',e=>{e.preventDefault();turn(b.dataset.d)})});
pause.onclick=()=>{paused=!paused;draw()};restart.onclick=reset;again.onclick=reset;reset();
})();
</script>
</body>
</html>
