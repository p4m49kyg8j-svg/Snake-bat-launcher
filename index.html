<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Snake</title>

<style>
html,body{
  margin:0;
  background:#090b10;
  color:white;
  font-family:system-ui,sans-serif;
  height:100%;
  overflow:hidden;
}

body{
  display:flex;
  justify-content:center;
  align-items:center;
}

#app{
  width:min(94vw,700px);
  text-align:center;
}

h1{
  margin:0 0 8px;
  font-size:clamp(28px,7vw,42px);
}

#hud{
  display:flex;
  justify-content:center;
  gap:12px;
  margin-bottom:8px;
  flex-wrap:wrap;
}

.pill{
  background:#181c25;
  border:1px solid #303746;
  border-radius:999px;
  padding:8px 15px;
  font-size:16px;
}

canvas{
  width:100%;
  aspect-ratio:1;
  background:#10151d;
  border:3px solid #303746;
  border-radius:16px;
  touch-action:none;
  display:block;
}

#pad{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:14px auto;
  max-width:420px;
}

button{
  height:76px;
  font-size:32px;
  font-weight:bold;
  border:0;
  border-radius:16px;
  background:#181c25;
  color:white;
  transition:
    transform .04s,
    background .04s;
  -webkit-tap-highlight-color:transparent;
  touch-action:manipulation;
  user-select:none;
  -webkit-user-select:none;
}

button:active{
  transform:scale(.92);
  background:#303846;
}

#pauseButton{
  font-size:28px;
}

#hint{
  color:#8b93a3;
  font-size:14px;
  margin-top:4px;
}

#modal{
  position:fixed;
  inset:0;
  background:#000c;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:10;
}

.box{
  background:#151a23;
  padding:30px;
  border-radius:22px;
  text-align:center;
  border:1px solid #343b48;
  width:min(80vw,360px);
  box-sizing:border-box;
}

.box h2{
  margin-top:0;
  font-size:30px;
}

.box p{
  font-size:20px;
}

.box button{
  width:100%;
  margin-top:10px;
}

#resumeButton{
  background:#16803c;
}

#restartButton{
  background:#252c39;
}

@media(max-width:500px){
  button{
    height:68px;
  }

  #pad{
    gap:8px;
    margin-top:10px;
  }
}
</style>
</head>

<body>

<div id="app">

<h1>🐍 Snake</h1>

<div id="hud">

  <div class="pill">
    Score: <b id="score">0</b>
  </div>

  <div class="pill">
    Best: <b id="best">0</b>
  </div>

</div>

<canvas id="game" width="600" height="600"></canvas>

<div id="pad">

  <div></div>

  <button id="up">▲</button>

  <div></div>

  <button id="left">◀</button>

  <button id="pauseButton">Ⅱ</button>

  <button id="right">▶</button>

  <div></div>

  <button id="down">▼</button>

  <div></div>

</div>

<div id="hint">
  Use the arrows or keyboard to move
</div>

</div>


<!-- PAUSE / GAME OVER MODAL -->

<div id="modal">

  <div class="box">

    <h2 id="message">Paused</h2>

    <p>
      Score: <b id="final">0</b>
    </p>

    <button id="resumeButton">
      ▶ Resume
    </button>

    <button id="restartButton">
      ↻ Restart
    </button>

  </div>

</div>


<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const N = 20;
const CELL = 30;

/* -------------------------
   GAME STATE
------------------------- */

let snake = [];
let dir = {x:1,y:0};

let inputQueue = [];

let food = null;

let score = 0;

let running = false;
let paused = false;

let last = 0;

const SPEED = 180;


/* -------------------------
   BEST SCORE
------------------------- */

let best = Number(
  localStorage.getItem("snakeBest") || 0
);

document.getElementById("best").textContent = best;


/* -------------------------
   HAPTICS
------------------------- */

function haptic(){

  if(navigator.vibrate){
    navigator.vibrate(8);
  }

}


/* -------------------------
   START / RESTART
------------------------- */

function restart(){

  snake = [
    {x:10,y:10},
    {x:9,y:10},
    {x:8,y:10}
  ];

  dir = {
    x:1,
    y:0
  };

  inputQueue = [];

  score = 0;

  running = true;
  paused = false;

  food = newFood();

  document.getElementById("modal").style.display = "none";

  updateHUD();

  draw();

  last = performance.now();

}


/* -------------------------
   FOOD
------------------------- */

function newFood(){

  let f;

  do{

    f = {
      x:Math.floor(Math.random()*N),
      y:Math.floor(Math.random()*N)
    };

  }while(
    snake.some(
      p => p.x === f.x && p.y === f.y
    )
  );

  return f;
}


/* -------------------------
   DIRECTION CONTROL
------------------------- */

function turn(x,y){

  if(!running || paused){
    return;
  }

  /*
    Look at the most recently queued
    direction, not just the current one.
  */

  const lastDir =
    inputQueue.length
      ? inputQueue[inputQueue.length - 1]
      : dir;


  /*
    Prevent a 180-degree reversal.
  */

  if(
    x === -lastDir.x &&
    y === -lastDir.y
  ){
    return;
  }


  /*
    Don't add the exact same direction twice.
  */

  if(
    x === lastDir.x &&
    y === lastDir.y
  ){
    return;
  }


  /*
    Allow several rapid inputs.

    Example:

    UP
    RIGHT
    DOWN

    can all be entered before the
    next movement tick.
  */

  if(inputQueue.length < 5){

    inputQueue.push({
      x:x,
      y:y
    });

    haptic();

  }

}


/* -------------------------
   BUTTON INPUT
------------------------- */

function bindButton(id,x,y){

  const button =
    document.getElementById(id);

  /*
    pointerdown fires immediately when
    the finger touches the button.
  */

  button.addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      turn(x,y);

    }
  );

}


/* Bind all four directions */

bindButton("up",0,-1);
bindButton("down",0,1);
bindButton("left",-1,0);
bindButton("right",1,0);


/* -------------------------
   PAUSE
------------------------- */

function pause(){

  if(!running || paused){
    return;
  }

  haptic();

  paused = true;

  document.getElementById("message")
    .textContent = "Paused";

  document.getElementById("final")
    .textContent = score;

  document.getElementById("resumeButton")
    .style.display = "block";

  document.getElementById("restartButton")
    .style.display = "block";

  document.getElementById("modal")
    .style.display = "flex";

}


/* -------------------------
   RESUME
------------------------- */

function resume(){

  if(!paused){
    return;
  }

  haptic();

  paused = false;

  /*
    Reset the timer here.

    This is important.

    Otherwise the game could immediately
    advance when coming back from pause.
  */

  last = performance.now();

  document.getElementById("modal")
    .style.display = "none";

}


/* -------------------------
   GAME OVER
------------------------- */

function gameOver(){

  running = false;
  paused = false;

  if(score > best){

    best = score;

    localStorage.setItem(
      "snakeBest",
      best
    );

  }

  document.getElementById("message")
    .textContent = "Game Over";

  document.getElementById("final")
    .textContent = score;

  document.getElementById("resumeButton")
    .style.display = "none";

  document.getElementById("restartButton")
    .style.display = "block";

  document.getElementById("modal")
    .style.display = "flex";

  updateHUD();

}


/* -------------------------
   PAUSE BUTTON
------------------------- */

document.getElementById("pauseButton")
  .addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      pause();

    }
  );


/* -------------------------
   RESUME BUTTON
------------------------- */

document.getElementById("resumeButton")
  .addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      resume();

    }
  );


/* -------------------------
   RESTART BUTTON
------------------------- */

document.getElementById("restartButton")
  .addEventListener(
    "pointerdown",
    function(e){

      e.preventDefault();

      haptic();

      restart();

    }
  );


/* -------------------------
   KEYBOARD
------------------------- */

document.addEventListener(
  "keydown",
  function(e){

    if(
      e.key === "ArrowUp" ||
      e.key === "w" ||
      e.key === "W"
    ){

      e.preventDefault();

      turn(0,-1);

    }


    if(
      e.key === "ArrowDown" ||
      e.key === "s" ||
      e.key === "S"
    ){

      e.preventDefault();

      turn(0,1);

    }


    if(
      e.key === "ArrowLeft" ||
      e.key === "a" ||
      e.key === "A"
    ){

      e.preventDefault();

      turn(-1,0);

    }


    if(
      e.key === "ArrowRight" ||
      e.key === "d" ||
      e.key === "D"
    ){

      e.preventDefault();

      turn(1,0);

    }


    if(e.key === " " || e.key === "p"){

      e.preventDefault();

      if(paused){
        resume();
      }else{
        pause();
      }

    }

  }
);


/* -------------------------
   GAME UPDATE
------------------------- */

function update(){

  if(!running || paused){
    return;
  }


  /*
    Process one queued direction
    on each movement tick.
  */

  if(inputQueue.length){

    dir = inputQueue.shift();

  }


  const head = {

    x:snake[0].x + dir.x,
    y:snake[0].y + dir.y

  };


  /* -------------------------
     COLLISION
  ------------------------- */

  if(
    head.x < 0 ||
    head.x >= N ||
    head.y < 0 ||
    head.y >= N ||
    snake.some(
      p =>
        p.x === head.x &&
        p.y === head.y
    )
  ){

    gameOver();

    return;

  }


  /* -------------------------
     MOVE
  ------------------------- */

  snake.unshift(head);


  /* -------------------------
     FOOD
  ------------------------- */

  if(
    head.x === food.x &&
    head.y === food.y
  ){

    score += 10;

    food = newFood();

    haptic();

  }else{

    snake.pop();

  }


  updateHUD();

}


/* -------------------------
   HUD
------------------------- */

function updateHUD(){

  document.getElementById("score")
    .textContent = score;

  document.getElementById("best")
    .textContent = best;

}


/* -------------------------
   DRAW
------------------------- */

function draw(){

  /*
    Background
  */

  ctx.fillStyle = "#10151d";

  ctx.fillRect(
    0,
    0,
    600,
    600
  );


  /*
    Food
  */

  ctx.fillStyle = "#67e8f9";

  ctx.fillRect(
    food.x * CELL + 6,
    food.y * CELL + 6,
    18,
    18
  );


  /*
    Snake
  */

  snake.forEach(
    function(p,i){

      ctx.fillStyle =
        i === 0
          ? "#a7f3d0"
          : "#34d399";

      ctx.fillRect(
        p.x * CELL + 2,
        p.y * CELL + 2,
        26,
        26
      );

    }
  );

}


/* -------------------------
   GAME LOOP
------------------------- */

function loop(t){

  if(
    running &&
    !paused &&
    t - last >= SPEED
  ){

    last = t;

    update();

    draw();

  }

  requestAnimationFrame(loop);

}


/* -------------------------
   START GAME
------------------------- */

restart();

requestAnimationFrame(loop);

</script>

</body>
</html>
